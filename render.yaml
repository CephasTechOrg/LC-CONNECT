services:
  - type: web
    name: lc-connect-api
    env: python
    # Ohio, to sit next to the Supabase database. The API was in Oregon while the database was in
    # Ohio (us-east-2), so every query crossed the country — ~50-70ms, paid ~6 times on a single
    # message send. It is also the closer region to a North Carolina campus, so the client's own
    # hop shortens too. Review Part 5 item 2 / checklist 2.0.
    #
    # A Render service's region cannot be changed in place: this value only takes effect when the
    # service is *created*. It is written here so a re-create cannot silently land back in Oregon
    # and quietly undo the single highest-leverage fix in the review.
    region: ohio
    plan: free
    branch: main
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    # One bootstrap step, not two. `alembic upgrade head` cannot build this database from empty
    # (see docs/reviews/BETA_FEEDBACK_REVIEW.md finding 18), and it ran *before* the create_all in
    # init_db.py — so a brand-new environment failed to deploy. bootstrap_db.py inspects the
    # database and takes the correct path: create+stamp when empty, upgrade when already managed.
    startCommand: PYTHONPATH=. python scripts/bootstrap_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PIP_ROOT_USER_ACTION
        value: ignore
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROFILE_BUCKET
        value: profile-images
      - key: MAX_PROFILE_IMAGE_MB
        value: "5"
      # Required for verifying mobile JWTs if the Supabase project signs with HS256 — RS256
      # projects can instead rely on JWKS from SUPABASE_URL alone (see app/config.py).
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Where a Supabase invite email's confirmation link sends the invitee — set these once
      # admin/ and employer-portal/ are actually deployed (see docs/getting-started/deployment.md
      # and the Blueprint Bond spec). Unset means invites fall back to Supabase's shared default
      # Site URL, which can only be correct for one of the two portals.
      - key: ADMIN_PORTAL_URL
        sync: false
      - key: EMPLOYER_PORTAL_URL
        sync: false
      # LC Connect's own branded emails (invites, password resets, signup confirmation) — every
      # Supabase auth email is routed through these instead of Supabase's own mailer. See
      # docs/getting-started/resend.md and docs/getting-started/send_email_hook.md. Without these,
      # email sending silently falls back to console logging (see app/email.py's _active_provider).
      - key: EMAIL_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      # Supabase "Send Email" Auth Hook secret — see docs/getting-started/send_email_hook.md.
      # Without this the hook endpoint refuses every request (503) rather than processing an
      # unverifiable webhook.
      - key: SUPABASE_SEND_EMAIL_HOOK_SECRET
        sync: false
      # Firebase Cloud Messaging service account JSON — push notifications are cleanly disabled
      # (not an error) if this is unset.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # Shown to suspended users on mobile + GET /account/suspension-status (#22).
      # Override in Render dashboard if the default campus inbox is wrong.
      - key: SUPPORT_EMAIL
        value: support@livingstone.edu
      # Soft-deleted message hard-purge window — used by scripts/purge_soft_deleted_messages.py (#21).
      - key: MESSAGE_SOFT_DELETE_RETENTION_DAYS
        value: "90"
      # ── Honors attendance ─────────────────────────────────────────────────────
      # Both of these were live in the Render dashboard but undeclared here, so they were
      # invisible to review and would be silently lost on a service re-create. `sync: false`
      # keeps the values out of git while making the requirement explicit.
      #
      # Off by default in app/config.py: when false, EVERY student attendance route returns 404
      # (see app/features/attendance/permissions.py::ensure_honors_attendance_enabled) and every
      # mobile attendance surface hides itself. Must be "true" wherever attendance is in use.
      - key: HONORS_ATTENDANCE_ENABLED
        sync: false
      # HMAC key for the rotating check-in QR. Unset → start_session 503s and any check-in is
      # rejected (verify_challenge_token returns False rather than trusting an unsigned code).
      - key: ATTENDANCE_QR_SIGNING_SECRET
        sync: false

  # ── Admin portal (Next.js) ────────────────────────────────────────────────────
  # A Node web service, NOT a static site: `admin/middleware.ts` refreshes the Supabase
  # session server-side on every request, which a static export cannot do.
  - type: web
    name: lc-connect-admin
    env: node
    # Deliberately still Oregon, and this file states what is actually running, not an intention.
    # A Render region applies only when a service is *created*, so declaring `ohio` here would mean
    # any future re-create silently relocates this service — a change nobody chose at that moment.
    #
    # Ohio would be the better home when it is moved deliberately: this is an SSR service that
    # calls the API on every request, so it now pays a cross-country hop per call, and its users
    # are on campus in NC. But it serves a handful of staff rather than the student body, and
    # moving it means delete-and-recreate with its env vars re-entered — worth doing opportunely,
    # not urgently. See the API service above for the move that mattered.
    region: oregon
    plan: free
    branch: main
    rootDir: admin
    buildCommand: npm ci && npm run build
    # `next start` binds to Render's assigned $PORT automatically — never hardcode a port here.
    startCommand: npm start
    envVars:
      # NEXT_PUBLIC_* values are inlined at BUILD time by Next.js, so these must be present
      # before the build step, not just at runtime. Render supplies them for both.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # Anon key only — the service-role key must never reach a browser bundle.
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Must include the /api/v1 suffix, e.g. https://lc-connect-api-xxxx.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # ── Employer partner portal (Next.js) ─────────────────────────────────────────
  - type: web
    name: lc-connect-employer
    env: node
    # See lc-connect-admin above — same reasoning, same decision.
    region: oregon
    plan: free
    branch: main
    rootDir: employer-portal
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

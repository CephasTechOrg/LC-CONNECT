# Blueprint for the two Next.js portals **only**.
#
# The API service is deliberately NOT declared here. Its region had to change (Oregon → Ohio, to
# sit next to the Supabase database), and a Render service's region is fixed at creation — so the
# API was deleted and re-created directly in the dashboard, in its own Render project.
#
# While it was still declared in this file, every push spun up a *second*, Oregon backend beside
# the real one: Render's blueprint sync creates any service this file declares that the blueprint
# does not already own, and it does not own a dashboard-created service.
#
# The trade-off, stated plainly: the API's environment variables are no longer in version control,
# which is the same gap that once hid `HONORS_ATTENDANCE_ENABLED` and
# `ATTENDANCE_QR_SIGNING_SECRET` from review entirely. Their home is now
# `docs/getting-started/deployment.md` §2 (service settings, build and start commands) and §3
# (every variable, with what breaks when each is missing). **Add new API settings there.**
#
# Do not re-add a `web` service for the API here without first deleting the dashboard-managed one,
# or the duplicate comes back.

services:
  # ── Admin portal (Next.js) ────────────────────────────────────────────────────
  # A Node web service, NOT a static site: `admin/middleware.ts` refreshes the Supabase
  # session server-side on every request, which a static export cannot do.
  - type: web
    name: lc-connect-admin
    env: node
    # Deliberately still Oregon, and this file states what is actually running, not an intention.
    # A Render region applies only when a service is *created*, so declaring `ohio` here would mean
    # any future re-create silently relocates this service — a change nobody chose at that moment.
    #
    # Ohio would be the better home when it is moved deliberately: this is an SSR service that
    # calls the API on every request, so it now pays a cross-country hop per call, and its users
    # are on campus in NC. But it serves a handful of staff rather than the student body, and
    # moving it means delete-and-recreate with its env vars re-entered — worth doing opportunely,
    # not urgently. See the API service above for the move that mattered.
    region: oregon
    plan: free
    branch: main
    rootDir: admin
    buildCommand: npm ci && npm run build
    # `next start` binds to Render's assigned $PORT automatically — never hardcode a port here.
    startCommand: npm start
    envVars:
      # NEXT_PUBLIC_* values are inlined at BUILD time by Next.js, so these must be present
      # before the build step, not just at runtime. Render supplies them for both.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      # Anon key only — the service-role key must never reach a browser bundle.
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Must include the /api/v1 suffix, e.g. https://lc-connect.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # ── Employer partner portal (Next.js) ─────────────────────────────────────────
  - type: web
    name: lc-connect-employer
    env: node
    # See lc-connect-admin above — same reasoning, same decision.
    region: oregon
    plan: free
    branch: main
    rootDir: employer-portal
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
